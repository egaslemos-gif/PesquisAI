<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer Blue Circle -->
  <circle cx="100" cy="90" r="85" fill="#2AABE2"/>
  <!-- White Text Circle Area -->
  <circle cx="100" cy="90" r="78" fill="#2AABE2" stroke="white" stroke-width="1"/>
  <!-- Brown/Gold Inner Ring -->
  <circle cx="100" cy="90" r="60" fill="none" stroke="#8B6914" stroke-width="6"/>
  <!-- White Inner Circle -->
  <circle cx="100" cy="90" r="54" fill="white"/>
  <!-- Water waves -->
  <path d="M55 105 Q65 98 75 105 Q85 112 95 105 Q105 98 115 105 Q125 112 135 105 Q145 98 155 105" fill="none" stroke="#7DD3F0" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M55 112 Q65 105 75 112 Q85 119 95 112 Q105 105 115 112 Q125 119 135 112 Q145 105 155 112" fill="none" stroke="#7DD3F0" stroke-width="2.5" stroke-linecap="round"/>
  <!-- UL Monogram -->
  <text x="100" y="95" text-anchor="middle" font-family="'Times New Roman', Georgia, serif" font-size="52" font-weight="bold" fill="#1A1A1A">UL</text>
  <!-- Top curved text: UNIVERSIDADE LICUNGO -->
  <path id="topArc" d="M25 90 A75 75 0 0 1 175 90" fill="none"/>
  <text fill="white" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3">
    <textPath href="#topArc" startOffset="50%" text-anchor="middle">UNIVERSIDADE LICUNGO</textPath>
  </text>
  <!-- Book shape at bottom -->
  <path d="M40 140 Q100 130 160 140 L160 170 Q100 160 40 170 Z" fill="#8B6914" opacity="0.9"/>
  <line x1="100" y1="132" x2="100" y2="168" stroke="white" stroke-width="1" opacity="0.5"/>
  <!-- MOÇAMBIQUE text -->
  <text x="100" y="195" text-anchor="middle" font-family="'Inter', Arial, sans-serif" font-size="12" font-weight="600" fill="#1A1A1A" letter-spacing="2">MOÇAMBIQUE</text>
</svg>
